{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="split">
<div>
  <p class="tag">Suivi sportif — muscu → course</p>
  <h1 class="hero">Soulevez.<br>Courez.<br>On note le<br><span class="hl">progrès</span></h1>
</div>
<section class="card">
  <h2>Connexion</h2>
  <form method="post" action="/login" class="stack">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="email"></label>
    <label>Mot de passe <input type="password" name="password" required autocomplete="current-password"></label>
    <button>Se connecter</button>
  </form>
  <p class="muted">Pas encore de compte ? <a href="/register">Créer un compte</a></p>
</section>
</div>
{% endblock %}
