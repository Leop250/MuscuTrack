# MODÈLE uniquement : les vraies valeurs ne sont jamais versionnées.
#
# Méthode conseillée (rien n'est écrit sur le disque) :
#   kubectl apply -f deploy/namespace.yaml
#   kubectl -n muscutrack create secret generic muscutrack-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
#
# Ou : copier ce fichier vers deploy/secret.yaml (ignoré par Git), remplacer les valeurs,
# puis kubectl apply -f deploy/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: muscutrack-secrets
  namespace: muscutrack
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  JWT_SECRET: change-me
