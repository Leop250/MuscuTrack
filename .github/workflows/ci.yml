# Intégration continue : à chaque push sur develop et à chaque pull request,
# vérifie que le code, les images Docker et les manifestes Kubernetes sont valides.
# Aussi appelé par release.yml avant toute mise en production.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

# Sur une pull request, un nouveau push annule la vérification en cours.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, tracking-service, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest -v

  docker:
    name: Build image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, tracking-service, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Construit l'image sans la publier : vérifie que le Dockerfile fonctionne.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  manifests:
    name: Manifestes Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assembler les manifestes avec Kustomize
        run: kubectl kustomize deploy/ > rendered.yaml

      - name: Vérifier qu'aucun Secret n'est versionné
        run: |
          if grep -q "^kind: Secret" rendered.yaml; then
            echo "::error::Un Secret est inclus dans les manifestes : il doit être créé hors de Git."
            exit 1
          fi
